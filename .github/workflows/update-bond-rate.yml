name: 채권할인율 자동 갱신

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  update-bond-rate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 채권할인율 조회
        run: python fetch_bond_rate.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bond_rate.json
          git diff --cached --quiet || git commit -m "채권할인율 자동 갱신"
          git push
