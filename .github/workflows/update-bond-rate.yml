name: 채권할인율 자동 갱신

on:
  schedule:
    - cron: '10 0 * * *'   # 매일 09:10 KST
    - cron: '10 9 * * *'   # 매일 18:10 KST (오후 6시 이후 다음 날 채권할인율이 정해진다)
    - cron: '10 10 * * *'  # 매일 19:10 KST (위 실행이 지연되거나 아직 반영 전일 때를 대비)
  workflow_dispatch:

jobs:
  update-bond-rate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 채권할인율 조회
        run: python fetch_bond_rate.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bond_rate.json
          git diff --cached --quiet || git commit -m "채권할인율 자동 갱신"
          git push
